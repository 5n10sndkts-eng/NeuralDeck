name: OpenCode Upstream Sync Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

jobs:
  upstream-sync:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync upstream + overlay
        run: ./scripts/opencode-upstream-bootstrap.sh

      - name: Pull latest upstream and re-apply overlay
        run: ./scripts/opencode-upstream-sync.sh

      - name: Capture upstream status
        run: ./scripts/opencode-upstream-status.sh | tee /tmp/opencode-upstream-status.txt

      - name: Verify overlay patch artifact
        run: |
          test -s patches/opencode-upstream/neuraldeck-overlay.patch
          wc -l patches/opencode-upstream/neuraldeck-overlay.patch

      - name: Detect repository changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request for upstream sync changes
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: codex/opencode-upstream-sync
          delete-branch: false
          title: "chore: sync OpenCode upstream overlay artifacts"
          body: |
            Automated update from `opencode-upstream-sync` workflow.

            Included updates may contain:
            - Overlay patch refresh
            - Upstream baseline metadata changes
            - Sync script output changes tracked in repo

            Review and merge when green.
          commit-message: "chore: sync OpenCode upstream overlay artifacts"
          labels: |
            automation
            opencode

      - name: Upload sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-upstream-sync-artifacts
          path: |
            /tmp/opencode-upstream-status.txt
            patches/opencode-upstream/neuraldeck-overlay.patch
          if-no-files-found: error
          retention-days: 14
